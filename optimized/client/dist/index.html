  <script>
// Protocol
function encodeInput(action) {
  return JSON.stringify({ type: 'input', ...action });
}
function decodeServerMessage(raw) {
  try {
    const data = JSON.parse(raw);
    if (data === null || typeof data !== 'object' || !('type' in data)) return null;
    return data;
  } catch { return null; }
}
function applyDelta(base, delta) {
  const result = { ...base, tick: delta.tick };
  if ('phase' in delta) result.phase = delta.phase;
  if ('round' in delta) result.round = delta.round;
  if ('winner' in delta) result.winner = delta.winner;
  if ('players' in delta || 'removed_players' in delta) {
    const removedIds = new Set(Array.isArray(delta.removed_players) ? delta.removed_players : []);
    const changedPlayers = Array.isArray(delta.players) ? delta.players : [];
    const changedById = new Map(changedPlayers.map(p => [p.id, p]));
    const merged = (base.players || [])
      .filter(p => !removedIds.has(p.id))
      .map(p => changedById.has(p.id) ? changedById.get(p.id) : p);
    for (const p of changedPlayers) {
      if (!merged.some(bp => bp.id === p.id)) merged.push(p);
    }
    result.players = merged;
  }
  if ('items' in delta) {
    const changedItems = Array.isArray(delta.items) ? delta.items : [];
    const changedById = new Map(changedItems.map(i => [i.id, i]));
    const merged = (base.items || []).map(i => changedById.has(i.id) ? changedById.get(i.id) : i);
    for (const i of changedItems) {
      if (!merged.some(bi => bi.id === i.id)) merged.push(i);
    }
    result.items = merged;
  }
  if ('events' in delta && Array.isArray(delta.events)) {
    result.events = [...(base.events || []), ...delta.events];
  }
  return result;
}

// ClientTransport
class ClientTransport {
  constructor(hooks) {
    this.hooks = hooks;
    this.socket = null;
    this.probe = undefined;
    this.lastSnapshot = null;
  }
  connect({ name, room }) {
    this.disconnect();
    const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const url = `${scheme}//${location.host}/ws`;
    const socket = new WebSocket(url);
    this.socket = socket;
    this.hooks.onStatus('Connecting...');
    socket.onopen = () => {
      socket.send(JSON.stringify({ type: 'join', name, room, delta: true }));
      this.hooks.onStatus('Connected');
      this.probe = window.setInterval(() => {
        if (socket.readyState === WebSocket.OPEN) {
          socket.send(JSON.stringify({ type: 'ping', nonce: Math.round(performance.now()) }));
        }
      }, 2000);
    };
    socket.onmessage = (event) => {
      const raw = (() => { try { return JSON.parse(event.data); } catch { return null; } })();
      if (raw === null || typeof raw !== 'object') return;
      if (raw.type === 'delta') {
        if (this.lastSnapshot) {
          const updated = applyDelta(this.lastSnapshot, raw);
          this.lastSnapshot = updated;
          this.hooks.onSnapshot(updated);
        }
        return;
      }
      const msg = decodeServerMessage(event.data);
      if (!msg) return;
      if (msg.type === 'welcome') this.hooks.onWelcome(msg);
      if (msg.type === 'snapshot') { this.lastSnapshot = msg; this.hooks.onSnapshot(msg); }
      if (msg.type === 'pong') this.hooks.onPong(Math.max(0, performance.now() - msg.nonce));
      if (msg.type === 'error') this.hooks.onStatus(`Server error: ${msg.message}`);
    };
    socket.onclose = () => {
      if (this.socket !== socket) return;
      this.clearProbe();
      this.hooks.onStatus('Disconnected. Click Join to reconnect.');
    };
    socket.onerror = () => this.hooks.onStatus('Connection error');
  }
  sendInput(action) {
    if (this.socket?.readyState === WebSocket.OPEN) this.socket.send(encodeInput(action));
  }
  rejoin() {
    if (this.socket?.readyState === WebSocket.OPEN) this.socket.send(JSON.stringify({ type: 'rejoin' }));
  }
  disconnect() {
    this.clearProbe();
    const prev = this.socket;
    this.socket = null;
    prev?.close();
  }
  clearProbe() {
    if (this.probe !== undefined) window.clearInterval(this.probe);
    this.probe = undefined;
  }
}

// ScenarioDataTransport
class ScenarioDataTransport {
  constructor(hooks) {
    this.hooks = hooks;
    this.socket = null;
    this.opening = null;
    this.awaiting = new Map();
    this.queue = Promise.resolve();
    this.lastSnapshot = null;
  }
  ensureSocket() {
    if (this.socket?.readyState === WebSocket.OPEN) return Promise.resolve();
    if (this.opening) return this.opening;
    const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(scheme + '//' + location.host + '/ws');
    this.socket = ws;
    this.opening = new Promise((resolve, reject) => {
      const fail = () => reject(new Error('Gameplay network connection failed'));
      ws.addEventListener('open', () => resolve(), {once: true});
      ws.addEventListener('error', fail, {once: true});
    }).finally(() => { this.opening = null; });
    ws.addEventListener('message', (event) => {
      try {
        const message = JSON.parse(event.data);
        if (message.type === 'welcome') this.hooks.onWelcome(message);
        else if (message.type === 'snapshot') {
          this.lastSnapshot = message;
          this.hooks.onSnapshot(this.lastSnapshot);
        } else if (message.type === 'delta') {
          if (this.lastSnapshot) {
            const updated = applyDelta(this.lastSnapshot, message);
            this.lastSnapshot = updated;
            this.hooks.onSnapshot(updated);
          }
        } else if (message.type === 'sim_game_ack') {
          const key = String(message.tick) + ':' + String(message.index);
          const pending = this.awaiting.get(key);
          if (pending) { this.awaiting.delete(key); pending.resolve(); }
        } else if (message.type === 'error') {
          const err = new Error(String(message.message));
          this.hooks.onError(err.message);
          for (const [, pending] of this.awaiting) pending.reject(err);
          this.awaiting.clear();
        }
      } catch (err) { this.hooks.onError(String(err)); }
    });
    ws.addEventListener('close', () => {
      this.socket = null;
      for (const [, pending] of this.awaiting) pending.reject(new Error('Gameplay socket closed'));
      this.awaiting.clear();
    });
    return this.opening;
  }
  async execute(runId, actor, room, tick, actions) {
    if (!actions.length) return;
    await this.ensureSocket();
    for (const [index, action] of actions.entries()) {
      if (!this.socket || this.socket.readyState !== WebSocket.OPEN)
        throw new Error('Gameplay transport is disconnected');
      const key = String(tick) + ':' + String(index);
      const payload = {
        type: action.op, sim_run: runId, sim_actor: actor,
        sim_tick: tick, sim_index: index,
      };
      if (action.op === 'join') {
        payload.name = action.name ?? actor;
        payload.room = room;
        if (true) payload.delta = true;
      } else if (action.op === 'input') {
        payload.seq = action.seq; payload.dx = action.dx; payload.dy = action.dy;
        payload.cloak = action.cloak ?? false;
      }
      await new Promise((resolve, reject) => {
        const timeout = window.setTimeout(() => {
          this.awaiting.delete(key); reject(new Error('Game action ACK timed out at tick ' + tick));
        }, 7000);
        this.awaiting.set(key, {
          resolve: () => { window.clearTimeout(timeout); resolve(); },
          reject: (error) => { window.clearTimeout(timeout); reject(error); },
        });
        this.socket.send(JSON.stringify(payload));
      });
    }
  }
  sendBatch(runId, actor, room, tick, actions) {
    const current = this.queue.then(() => this.execute(runId, actor, room, tick, actions));
    this.queue = current.catch(() => undefined);
    return current;
  }
  close() {
    this.socket?.close();
    this.socket = null;
  }
}

// GameUI
class GameUI {
  constructor(mount) {
    this.keys = new Set();
    this.pendingCloak = false;
    this.snapshot = null;
    this.ownId = '';
    this.width = 960;
    this.height = 600;
    this.rtt = 0;
    this.seenEvents = new Set();
    mount.innerHTML = `
      <div class="shell">
        <header class="topbar"><div><span class="eyebrow">COMPUTER NETWORKS · ASSIGNMENT 1</span>
          <h1>Tag, You're Lagged<span class="accent">!</span></h1>
          <p>Move. Collect. Survive. Design the network.</p></div>
          <div class="signal"><span class="signal-dot"></span><span id="status">Not connected</span></div>
        </header>
        <section class="toolbar">
          <label>Player name<input id="player-name" maxlength="18" value="Player" autocomplete="off" /></label>
          <label>Room<input id="room-name" maxlength="20" value="main" autocomplete="off" /></label>
          <button id="join-btn">Create / Join</button><button id="rejoin-btn" class="secondary">Rejoin</button><button id="leave-btn" class="secondary">Leave</button>
          <div class="stats" id="metrics">RTT — · Tick —</div>
        </section>
        <div class="main-grid">
          <div class="game-column">
            <div class="arena"><canvas id="arena" width="960" height="600" aria-label="Game arena"></canvas>
              <div class="arena-corner">ROOM <span id="room-label">—</span></div></div>
            <div class="hint"><strong>WASD / ARROW KEYS</strong> Move <i>·</i> <strong>SPACE</strong> Cloak for 3s (5 credits) <i>·</i> Collect orbs and outgrow rivals</div>
          </div>
          <aside><section class="panel"><h2>Players</h2><div id="scoreboard" class="scores"><p class="empty">Join a room to play.</p></div></section>
          <section class="panel"><h2>Game events</h2><div id="feed" class="feed"><p class="empty">Events will appear here.</p></div></section>
          <section class="panel"><h2>Network lab</h2><p>Mode: Adaptive Delta Snapshot (Optimized)</p><p class="muted">Live status & synchronization active.</p></section></aside>
        </div>
      </div>`;
    this.canvas = mount.querySelector('#arena');
    this.ctx = this.canvas.getContext('2d');
    this.status = mount.querySelector('#status');
    this.metrics = mount.querySelector('#metrics');
    this.scoreboard = mount.querySelector('#scoreboard');
    this.feed = mount.querySelector('#feed');
    this.roomLabel = mount.querySelector('#room-label');
    this.nameInput = mount.querySelector('#player-name');
    this.roomInput = mount.querySelector('#room-name');
    document.addEventListener('keydown', e => {
      if (e.target instanceof HTMLInputElement) return;
      const key = e.key.toLowerCase();
      if (['arrowup','arrowdown','arrowleft','arrowright',' '].includes(key)) e.preventDefault();
      this.keys.add(key);
      if (key === ' ' && !e.repeat) this.pendingCloak = true;
    });
    document.addEventListener('keyup', e => this.keys.delete(e.key.toLowerCase()));
    window.addEventListener('blur', () => this.keys.clear());
  }
  onJoin(fn) {
    document.getElementById('join-btn').addEventListener('click', () => fn(this.nameInput.value.trim() || 'Player', this.roomInput.value.trim() || 'main'));
  }
  onRejoin(fn) { document.getElementById('rejoin-btn').addEventListener('click', fn); }
  onLeave(fn) { document.getElementById('leave-btn').addEventListener('click', fn); }
  setWorldSize(w, h) { this.width = w; this.height = h; }
  setPlayerId(id) { this.ownId = id; this.seenEvents.clear(); this.snapshot = null; }
  setRoom(room) { this.roomLabel.textContent = room; }
  setStatus(status) { this.status.textContent = status; }
  setRtt(val) { this.rtt = val; this.updateStats(); }
  readInput() {
    const on = (...names) => names.some(n => this.keys.has(n));
    const dx = Number(on('d','arrowright')) - Number(on('a','arrowleft'));
    const dy = Number(on('s','arrowdown')) - Number(on('w','arrowup'));
    const cloak = this.pendingCloak;
    this.pendingCloak = false;
    return { dx: dx !== 0 ? dx : 0, dy: dx !== 0 ? 0 : dy, cloak };
  }
  update(snapshot) {
    this.snapshot = snapshot;
    this.updateStats();
    this.updateScoreboard();
    this.updateFeed(snapshot.events || []);
    if (snapshot.phase === 'waiting') this.setStatus('Waiting for at least two players...');
    else if (snapshot.phase === 'finished') this.setStatus(snapshot.winner === this.ownId ? 'You win!' : 'Round finished — rejoin to play again');
    else if ((snapshot.players || []).find(p => p.id === this.ownId)?.alive === false) this.setStatus('Eliminated — click Rejoin');
    else this.setStatus(`Round ${snapshot.round} running`);
  }
  updateStats() {
    this.metrics.textContent = `App RTT ${this.rtt ? this.rtt.toFixed(0) + ' ms' : '—'}  ·  Tick ${this.snapshot?.tick ?? '—'}  ·  Players ${this.snapshot?.players?.length ?? 0}`;
  }
  updateScoreboard() {
    const players = [...(this.snapshot?.players ?? [])].sort((a,b) => b.credits-a.credits);
    this.scoreboard.replaceChildren(...players.map((player,i) => {
      const entry = document.createElement('div');
      entry.className = `score-row ${player.id === this.ownId ? 'mine' : ''}`;
      const index = document.createElement('span'); index.textContent = `#${i+1}`;
      const name = document.createElement('span'); name.textContent = player.name;
      const score = document.createElement('strong'); score.textContent = `${player.credits}`;
      entry.append(index,name,score);
      return entry;
    }));
  }
  updateFeed(events) {
    const players = new Map((this.snapshot?.players ?? []).map(p => [p.id, p.name]));
    for (const event of events) {
      if (this.seenEvents.has(event.id)) continue;
      this.seenEvents.add(event.id);
      const line = document.createElement('p');
      const actor = players.get(event.actor ?? '') ?? 'A player';
      line.textContent = event.type === 'collect'
        ? `${actor} collected ${event.tier} (+${event.value})`
        : event.type === 'kill' ? `${actor} eliminated ${players.get(event.target ?? '') ?? 'a player'}`
        : event.type === 'cloak' ? `${actor} activated cloak`
        : event.type === 'start' ? `Round ${event.round} started`
        : event.type === 'finish' ? 'Round finished'
        : `${event.type}: ${actor}`;
      this.feed.prepend(line);
    }
    while (this.feed.children.length > 7) this.feed.lastElementChild?.remove();
    if (this.seenEvents.size > 1000) this.seenEvents.clear();
  }
  start() {
    const render = () => { this.draw(); requestAnimationFrame(render); };
    requestAnimationFrame(render);
  }
  draw() {
    const ctx = this.ctx, w = this.canvas.width, h = this.canvas.height;
    ctx.clearRect(0,0,w,h);
    ctx.fillStyle = '#111c2c'; ctx.fillRect(0,0,w,h);
    ctx.strokeStyle = '#203249'; ctx.lineWidth = 1;
    for (let x=0;x<w;x+=40) { ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,h); ctx.stroke(); }
    for (let y=0;y<h;y+=40) { ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(w,y); ctx.stroke(); }
    if (!this.snapshot) {
      ctx.fillStyle = '#a4b5ce'; ctx.font = '600 22px system-ui'; ctx.textAlign='center';
      ctx.fillText('JOIN A ROOM TO PLAY',w/2,h/2); ctx.textAlign='left'; return;
    }
    const sx=w/this.width, sy=h/this.height;
    for (const item of (this.snapshot.items || [])) {
      const x=item.x*sx,y=item.y*sy;
      ctx.beginPath(); ctx.arc(x,y,item.radius+7,0,Math.PI*2); ctx.fillStyle='#e9bc5122';ctx.fill();
      ctx.beginPath(); ctx.arc(x,y,item.radius,0,Math.PI*2); ctx.fillStyle= item.tier === 'large' ? '#f59e70' : item.tier === 'medium' ? '#f2b957' : '#fce6a0'; ctx.fill();
    }
    for (const player of (this.snapshot.players || [])) {
      if (!player.alive) continue;
      const x=player.x*sx,y=player.y*sy;
      ctx.beginPath();ctx.arc(x,y,player.radius*sx,0,2*Math.PI);
      ctx.fillStyle=player.invisible ? '#ba9aff' : player.id===this.ownId?'#43dcb3':'#63a5f3';ctx.fill();
      ctx.lineWidth=3;ctx.strokeStyle=player.id===this.ownId?'#e3fff4':'#c4dcff';ctx.stroke();
      ctx.fillStyle='#101c28';ctx.beginPath();ctx.arc(x-5,y-2,2.5,0,2*Math.PI);ctx.arc(x+5,y-2,2.5,0,2*Math.PI);ctx.fill();
      ctx.font='600 13px system-ui';ctx.textAlign='center';ctx.fillStyle='#eaf2ff';ctx.fillText(player.name,x,y-27);ctx.textAlign='left';
    }
  }
}

// BrowserSimulator
class BrowserSimulator {
  constructor(ui, mount) {
    this.ui = ui;
    this.script = null;
    this.socket = null;
    this.actor = '';
    this.runId = '';
    this.registered = false;
    this.finished = false;
    this.resultUrl = null;
    this.data = new ScenarioDataTransport({
      onWelcome: (w) => { this.ui.setPlayerId(w.id); this.ui.setRoom(w.room); this.ui.setWorldSize(w.width, w.height); },
      onSnapshot: (s) => this.ui.update(s),
      onError: (err) => this.setStatus('Gameplay transport: ' + err),
    });
    const shell = mount.querySelector('.shell');
    const panel = document.createElement('section');
    panel.className = 'panel simulator';
    panel.id = 'simulator-panel';
    panel.innerHTML = `
      <h2>Browser Scenario Mode</h2>
      <p>Upload the same JSON, choose distinct players and a shared Run ID. All browsers Ready together. Correctness mode waits for game-transport acknowledgements; real-time mode runs at fixed 20 Hz without waiting.</p>
      <div class="sim-grid">
        <label>Scenario JSON<input id="sim-file" type="file" accept=".json,application/json"></label>
        <label>Shared Run ID<input id="sim-run" value="class-test-01" maxlength="32"></label>
        <label>This browser controls<select id="sim-actor"><option value="">Load a scenario first</option></select></label>
        <label>Scenario name<div id="sim-name" class="stats">—</div></label>
        <label>Execution mode<select id="sim-mode"><option value="lockstep">Correctness — lockstep</option><option value="realtime">Networking — real time</option></select></label>
      </div>
      <div class="sim-controls">
        <button id="sim-connect">Connect to test lobby</button>
        <button id="sim-ready" class="secondary" disabled>Ready</button>
        <span id="sim-status" role="status">Upload a scenario to begin.</span>
        <a id="sim-download" hidden>Download result JSON</a>
      </div>
      <div class="sim-samples">Sample input:
        <a href="/samples/two_player_finish.input.json" download>Two-player finish</a>
        <a href="/samples/late_join_finish.input.json" download>Late join</a>
        <a href="/samples/duplicate_input_finish.input.json" download>Duplicate/stale actions</a>
        <a href="/samples/credit_cloak_finish.input.json" download>Credit + cloak</a>
      </div>
      <pre id="sim-output" class="sim-console" data-testid="sim-output" aria-live="polite">No test results yet.</pre>
    `;
    shell.append(panel);
    this.fileInput = panel.querySelector('#sim-file');
    this.actorSelect = panel.querySelector('#sim-actor');
    this.runInput = panel.querySelector('#sim-run');
    this.modeSelect = panel.querySelector('#sim-mode');
    this.status = panel.querySelector('#sim-status');
    this.output = panel.querySelector('#sim-output');
    this.readyButton = panel.querySelector('#sim-ready');
    this.resultLink = panel.querySelector('#sim-download');
    this.fileInput.addEventListener('change', () => void this.loadFile());
    panel.querySelector('#sim-connect').addEventListener('click', () => this.connect());
    this.readyButton.addEventListener('click', () => this.ready());
  }
  async loadFile() {
    try {
      const file = this.fileInput.files?.[0];
      if (!file) return;
      const script = JSON.parse(await file.text());
      const players = [...new Set(script.events.filter(e => e.op === 'join').map(e => e.player))];
      this.script = script;
      this.actorSelect.replaceChildren(...players.map(player => {
        const opt = document.createElement('option');
        opt.value = player; opt.textContent = player; return opt;
      }));
      document.getElementById('sim-name').textContent = script.name;
      this.setStatus('Loaded. Use same JSON and Run ID in all browsers.');
      this.output.textContent = JSON.stringify({ scenario: script.name, players, ticks: script.ticks, actions: script.events.length }, null, 2);
    } catch (err) {
      this.setStatus(err.message || 'Unable to parse file');
    }
  }
  setStatus(s) { this.status.textContent = s; }
  connect() {
    if (!this.script) { this.setStatus('Load a scenario first.'); return; }
    const runId = this.runInput.value.trim();
    const actor = this.actorSelect.value;
    if (!actor) { this.setStatus('Choose a player slot.'); return; }
    this.socket?.close();
    this.data.close();
    this.actor = actor; this.runId = runId;
    this.readyButton.disabled = true; this.resultLink.hidden = true;
    this.ui.setPlayerId(actor); this.ui.setRoom(this.script.room); this.ui.setWorldSize(960, 600);
    const scheme = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(scheme + '//' + location.host + '/sim/ws');
    this.socket = ws;
    this.setStatus('Connecting to synchronized test lobby...');
    ws.addEventListener('open', () => ws.send(JSON.stringify({
      type: 'sim_register', run_id: runId, player: actor, scenario: this.script, mode: this.modeSelect.value,
    })));
    ws.addEventListener('message', (event) => {
      try { this.handle(JSON.parse(event.data)); } catch (e) { this.setStatus('Invalid simulator response: ' + e); }
    });
  }
  ready() {
    if (!this.registered || this.socket?.readyState !== WebSocket.OPEN) return;
    this.socket.send(JSON.stringify({ type: 'sim_ready' }));
    this.readyButton.disabled = true;
    this.setStatus('Ready. Waiting for every scripted player.');
  }
  handle(message) {
    const kind = message.type;
    if (kind === 'sim_registered') {
      this.registered = true; this.readyButton.disabled = false; this.setStatus('Registered. Click Ready.');
    } else if (kind === 'sim_lobby') {
      const total = Array.isArray(message.players) ? message.players.length : '?';
      const ready = Array.isArray(message.ready) ? message.ready.length : '?';
      this.setStatus('Lobby: ' + ready + '/' + total + ' ready.');
    } else if (kind === 'sim_started') {
      this.readyButton.disabled = true; this.setStatus('All ready. Simulation starting.');
    } else if (kind === 'sim_tick') {
      const tick = message.tick;
      if (typeof tick !== 'number' || !this.script) return;
      const actions = this.script.events.filter(e => e.tick === tick && e.player === this.actor);
      void this.data.sendBatch(this.runId, this.actor, this.script.room, tick, actions)
        .then(() => this.socket?.send(JSON.stringify({ type: 'sim_actions', tick, count: actions.length, run_id: this.runId })))
        .catch(err => this.setStatus('Data-plane action failed: ' + err));
    } else if (kind === 'sim_result') {
      this.finished = true; this.data.close();
      const report = message.report;
      this.output.textContent = JSON.stringify(report, null, 2);
      this.setStatus(report?.verdict === 'PASS' ? 'PASS — outcome matches oracle.' : 'FAIL — outcome differs.');
      if (this.resultUrl) URL.revokeObjectURL(this.resultUrl);
      this.resultUrl = URL.createObjectURL(new Blob([JSON.stringify(report, null, 2)], {type: 'application/json'}));
      this.resultLink.href = this.resultUrl;
      this.resultLink.download = this.runId + '.result.json';
      this.resultLink.hidden = false;
    } else if (kind === 'sim_error') {
      this.setStatus('Simulator error: ' + message.message);
    }
  }
}

// Main App Bootstrap
window.addEventListener('DOMContentLoaded', () => {
  const mount = document.getElementById('app');
  const ui = new GameUI(mount);
  new BrowserSimulator(ui, mount);
  let playerId = '';
  let seq = 0;
  let connected = false;
  let mostRecentTick = -1;

  const network = new ClientTransport({
    onWelcome(message) {
      playerId = message.id;
      seq = 0; mostRecentTick = -1; connected = true;
      ui.setWorldSize(message.width, message.height);
      ui.setPlayerId(playerId);
      ui.setRoom(message.room);
    },
    onSnapshot(snapshot) {
      if (snapshot.tick < mostRecentTick) return;
      mostRecentTick = snapshot.tick;
      ui.update(snapshot);
    },
    onPong(rttMs) { ui.setRtt(rttMs); },
    onStatus(status) {
      if (status.startsWith('Disconnected') || status === 'Connection error') connected = false;
      ui.setStatus(status);
    }
  });

  ui.onJoin((name, room) => { connected = false; network.connect({ name, room }); });
  ui.onLeave(() => { network.disconnect(); connected = false; ui.setStatus('Left game'); });
  ui.onRejoin(() => network.rejoin());

  window.setInterval(() => {
    if (!connected) return;
    const { dx, dy, cloak } = ui.readInput();
    network.sendInput({ seq: ++seq, dx, dy, cloak });
  }, 100);

  ui.start();
});
</script>
